apiVersion: k8s.sovereignite.io/v1alpha1
kind: UpstreamLock
metadata:
  name: sovereignite
spec:
  components:
    calico:
      version: v3.32.1
      source: https://raw.githubusercontent.com/projectcalico/calico/v3.32.1/manifests/tigera-operator.yaml
    gateway-api:
      version: v1.6.1
      source: https://github.com/kubernetes-sigs/gateway-api/releases/download/v1.6.1/standard-install.yaml
    istio:
      version: 1.30.3
      charts:
        - repo: https://istio-release.storage.googleapis.com/charts
          name: base
        - repo: https://istio-release.storage.googleapis.com/charts
          name: istiod
    cert-manager:
      version: v1.21.1
      source: https://github.com/cert-manager/cert-manager/releases/download/v1.21.1/cert-manager.yaml
    spire:
      version: 1.15.2
      images:
        server: ghcr.io/spiffe/spire-server:1.15.2
        agent: ghcr.io/spiffe/spire-agent:1.15.2
    knative-serving:
      version: v1.22.1
      sources:
        - https://github.com/knative/serving/releases/download/knative-v1.22.1/serving-core.yaml
    knative-eventing:
      version: v1.22.2
      sources:
        - https://github.com/knative/eventing/releases/download/knative-v1.22.2/eventing-core.yaml
    knative-net-gateway-api:
      version: v1.22.1
      source: https://github.com/knative-extensions/net-gateway-api/releases/download/knative-v1.22.1/net-gateway-api.yaml
