apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: sample-knative
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containers:
        - image: gcr.io/knative-samples/helloworld-go
          env:
            - name: TARGET
              value: sovereignite
