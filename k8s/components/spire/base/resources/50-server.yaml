apiVersion: v1
kind: Service
metadata:
  name: spire-server
  namespace: spire
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: spire-server
  ports:
    - name: grpc
      port: 8081
      targetPort: grpc
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
spec:
  serviceName: spire-server
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-server
    spec:
      serviceAccountName: spire-server
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
        kubernetes.io/hostname: cp-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: spire-server
              topologyKey: kubernetes.io/hostname
      containers:
        - name: spire-server
          image: ghcr.io/sovereignite/spire-server-tpm:1.15.2-sovereignite.0
          command:
            - /opt/spire/bin/spire-server
          args:
            - run
            - -config
            - /run/spire/config/server.conf
          env:
            - name: TPM2_PKCS11_STORE
              value: /var/lib/sovereignite/tpm2-pkcs11
            - name: TPM2TOOLS_TCTI
              value: device:/dev/tpmrm0
            - name: TSS2_TCTI
              value: device:/dev/tpmrm0
            - name: TPM_PKCS11_PIN
              valueFrom:
                secretKeyRef:
                  name: tpm2-pkcs11-pin
                  key: user-pin
          ports:
            - name: grpc
              containerPort: 8081
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: tpm-attestor-ca
              mountPath: /run/spire/tpm-attestor-ca
              readOnly: true
            - name: data
              mountPath: /run/spire/data
            - name: tpm2-pkcs11
              mountPath: /var/lib/sovereignite/tpm2-pkcs11
            - name: spire-server-socket
              mountPath: /run/spire/sockets
            - name: tpm-keymanager-socket
              mountPath: /run/spire-tpm-keymanager
            - name: tpmrm
              mountPath: /dev/tpmrm0
        - name: spire-controller-manager
          image: ghcr.io/spiffe/spire-controller-manager:0.7.0
          args:
            - --config=/run/spire-controller-manager/config/controller-manager-config.yaml
          env:
            - name: ENABLE_WEBHOOKS
              value: "false"
          ports:
            - name: healthz
              containerPort: 8083
          livenessProbe:
            httpGet:
              path: /healthz
              port: healthz
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: healthz
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsGroup: 65532
            runAsNonRoot: true
            runAsUser: 65532
          volumeMounts:
            - name: controller-manager-config
              mountPath: /run/spire-controller-manager/config
              readOnly: true
            - name: spire-server-socket
              mountPath: /run/spire/sockets
      volumes:
        - name: config
          configMap:
            name: spire-server-config
        - name: controller-manager-config
          configMap:
            name: spire-controller-manager-config
        - name: tpm-attestor-ca
          configMap:
            name: spire-tpm-attestor-ca
        - name: data
          hostPath:
            path: /var/lib/sovereignite/spire-server
            type: DirectoryOrCreate
        - name: tpm2-pkcs11
          hostPath:
            path: /var/lib/sovereignite/tpm2-pkcs11
            type: Directory
        - name: spire-server-socket
          emptyDir: {}
        - name: tpm-keymanager-socket
          emptyDir: {}
        - name: tpmrm
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
