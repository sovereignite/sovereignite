apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-agent
    spec:
      serviceAccountName: spire-agent
      hostPID: true
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: spire-agent
          image: ghcr.io/spiffe/spire-agent:1.15.2
          args:
            - -config
            - /run/spire/config/agent.conf
          env:
            - name: TPM2TOOLS_TCTI
              value: device:/dev/tpmrm0
            - name: TSS2_TCTI
              value: device:/dev/tpmrm0
          securityContext:
            privileged: true
          volumeMounts:
            - name: config
              mountPath: /run/spire/config
              readOnly: true
            - name: trust-bundle
              mountPath: /run/spire/bundle
              readOnly: true
            - name: spire-sockets
              mountPath: /run/spire/sockets
            - name: tpmrm
              mountPath: /dev/tpmrm0
            - name: sovereignite-tpm
              mountPath: /var/lib/sovereignite/tpm
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: spire-agent-config
        - name: trust-bundle
          configMap:
            name: spire-agent-bundle
        - name: spire-sockets
          hostPath:
            path: /run/spire/sockets
            type: DirectoryOrCreate
        - name: tpmrm
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
        - name: sovereignite-tpm
          hostPath:
            path: /var/lib/sovereignite/tpm
            type: Directory
