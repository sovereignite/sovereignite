apiVersion: pki.sovereignite.io/v1alpha1
kind: TPMCSRSignerPolicy
metadata:
  name: kubelet-serving
spec:
  signerName: sovereignite.local/tpm-kubelet-serving
  caRef:
    name: kubernetes-ca
    certificateConfigMapRef:
      name: kubernetes-ca
      namespace: sovereignite-system
      key: ca.crt
  pkcs11:
    modulePath: /usr/lib/x86_64-linux-gnu/pkcs11/libtpm2_pkcs11.so
    tokenLabel: sovereignite-ca
    keyLabel: sovereignite-kubernetes-ca
    userPinSecretRef:
      name: tpm-pkcs11-pin
      namespace: sovereignite-system
      key: user-pin
  allowedUsages:
    - digital signature
    - key encipherment
    - server auth
  allowedSubjectRegexes:
    - '^system:node:[a-z0-9.-]+$'
  maxDuration: 8760h
  requireApprovedCondition: true
