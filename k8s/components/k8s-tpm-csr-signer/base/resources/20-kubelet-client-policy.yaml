apiVersion: pki.sovereignite.io/v1alpha1
kind: TPMCSRSignerPolicy
metadata:
  name: kubelet-client
spec:
  signerName: sovereignite.local/tpm-kubelet-client
  caRef:
    name: kubernetes-ca
    certificateConfigMapRef:
      name: kubernetes-ca
      namespace: sovereignite-system
      key: ca.crt
  pkcs11:
    modulePath: /usr/lib64/pkcs11/libtpm2_pkcs11.so
    tokenLabel: sovereignite-ca
    keyLabel: sovereignite-kubernetes-ca
    userPinEnv: TPM2_PKCS11_USER_PIN
  allowedUsages:
    - digital signature
    - key encipherment
    - client auth
  allowedSubjectRegexes:
    - '^system:node:[a-z0-9.-]+$'
  maxDuration: 8760h
  requireApprovedCondition: true
