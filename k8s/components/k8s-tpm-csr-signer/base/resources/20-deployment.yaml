apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-tpm-csr-signer
  namespace: sovereignite-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: k8s-tpm-csr-signer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: k8s-tpm-csr-signer
    spec:
      serviceAccountName: k8s-tpm-csr-signer
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
        kubernetes.io/hostname: cp-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: ghcr.io/sovereignite/k8s-tpm-csr-signer:v0.1.0
          command:
            - /bin/sh
            - -ceu
            - |
              . /var/lib/sovereignite/tpm2-pkcs11/pins.env
              export TPM2_PKCS11_STORE=/var/lib/sovereignite/tpm2-pkcs11
              export TPM2TOOLS_TCTI=device:/dev/tpmrm0
              export TSS2_TCTI=device:/dev/tpmrm0
              export TPM2_PKCS11_USER_PIN
              exec /usr/local/bin/k8s-tpm-csr-signer "$@"
            - --
          args:
            - --leader-election-namespace=sovereignite-system
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tpmrm
              mountPath: /dev/tpmrm0
            - name: tpm2-pkcs11
              mountPath: /var/lib/sovereignite/tpm2-pkcs11
              readOnly: true
      volumes:
        - name: tpmrm
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
        - name: tpm2-pkcs11
          hostPath:
            path: /var/lib/sovereignite/tpm2-pkcs11
            type: Directory
