      - jobsinks
      - jobsinks/status
      - integrationsinks
      - integrationsinks/status
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
  - apiGroups:
      - eventing.knative.dev
    resources:
      - brokers/finalizers
      - triggers/finalizers
      - eventtransforms/finalizers
    verbs:
      - update
  - apiGroups:
      - sources.knative.dev
    resources:
      - sinkbindings/finalizers
    verbs:
      - update
  - apiGroups:
      - ""
    resources:
      - services/finalizers
    verbs:
      - update
  - apiGroups:
      - sinks.knative.dev
    resources:
      - jobsinks/finalizers
      - integrationsinks/finalizers
    verbs:
      - update
  - apiGroups:
      - messaging.knative.dev
