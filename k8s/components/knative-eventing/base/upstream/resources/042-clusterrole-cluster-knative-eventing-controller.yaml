      - cert-manager.io
    resources:
      - certificates/finalizers
    verbs:
      - update
  - apiGroups:
      - acme.cert-manager.io
    resources:
      - challenges
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
