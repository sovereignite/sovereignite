      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
  - apiGroups:
      - flows.knative.dev
    resources:
      - sequences
      - sequences/status
      - parallels
      - parallels/status
    verbs:
      - get
      - list
      - create
      - update
      - delete
      - patch
      - watch
  - apiGroups:
      - messaging.knative.dev
    resources:
      - sequences/finalizers
      - parallels/finalizers
      - channels/finalizers
    verbs:
      - update
  - apiGroups:
      - flows.knative.dev
    resources:
      - sequences/finalizers
      - parallels/finalizers
    verbs:
      - update
