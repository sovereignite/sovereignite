# Source apiVersion: v1
apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/component: broker-ingress
    app.kubernetes.io/name: knative-eventing
    app.kubernetes.io/version: 1.22.2
    eventing.knative.dev/brokerRole: ingress
  name: broker-ingress
  namespace: knative-eventing
spec:
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: 8080
    - name: https
      port: 443
      protocol: TCP
      targetPort: 8443
    - name: http-metrics
      port: 9092
      protocol: TCP
      targetPort: 9092
  selector:
    eventing.knative.dev/brokerRole: ingress
