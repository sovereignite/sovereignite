apiVersion: apps/v1
kind: StatefulSet
metadata:
  labels:
    app.kubernetes.io/component: request-reply
    app.kubernetes.io/name: knative-eventing
    app.kubernetes.io/version: 1.22.2
  name: request-reply
  namespace: knative-eventing
spec:
  replicas: 1
  selector:
    matchLabels:
      eventing.knative.dev/part-of: request-reply
  template:
    metadata:
      labels:
        app.kubernetes.io/component: request-reply
        app.kubernetes.io/name: knative-eventing
        app.kubernetes.io/version: 1.22.2
        eventing.knative.dev/part-of: request-reply
    spec:
      containers:
        - env:
            - name: SYSTEM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: HTTP_PORT
              value: "8080"
            - name: HTTPS_PORT
              value: "8443"
            - name: SECRETS_PATH
              value: /etc/secrets
            - name: CONFIG_LOGGING_NAME
              value: config-logging
            - name: CONFIG_OBSERVABILITY_NAME
              value: config-observability
          image: gcr.io/knative-releases/knative.dev/eventing/cmd/requestreply@sha256:f4d194097b43865e396f54b4fd94f779a2ed96c9691a3a8de4740722e5535804
          name: request-reply
          ports:
            - containerPort: 8080
              name: http
              protocol: TCP
            - containerPort: 8443
              name: https
              protocol: TCP
          volumeMounts:
            - mountPath: /etc/secrets
              name: aes-keys
      restartPolicy: Always
      serviceAccountName: request-reply
      volumes:
        - name: aes-keys
          secret:
            secretName: request-reply-keys
