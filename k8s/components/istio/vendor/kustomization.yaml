apiVersion: kustomize.config.k8s.io/v1beta1
helmCharts:
- includeCRDs: true
  name: base
  namespace: istio-system
  releaseName: istio-base
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.30.3
- includeCRDs: true
  name: istiod
  namespace: istio-system
  releaseName: istiod
  repo: https://istio-release.storage.googleapis.com/charts
  valuesInline:
    global:
      caAddress: ""
      meshID: sovereignite
      multiCluster:
        clusterName: sovereignite
      proxy:
        privileged: false
    meshConfig:
      accessLogFile: /dev/stdout
      defaultConfig:
        holdApplicationUntilProxyStarts: true
      trustDomain: sovereignite.local
    pilot:
      env:
        ENABLE_NATIVE_SIDECARS: "true"
  version: 1.30.3
kind: Kustomization
namespace: istio-system
