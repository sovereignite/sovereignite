apiVersion: pki.sovereignite.io/v1alpha1
kind: TPMClusterIssuer
metadata:
  name: sovereignite-root
spec:
  signerName: tpmclusterissuers.pki.sovereignite.io/sovereignite-root
  caRef:
    name: sovereignite-root
  pkcs11:
    modulePath: /usr/lib64/pkcs11/libtpm2_pkcs11.so
    tokenLabel: sovereignite-ca
    keyLabel: sovereignite-root-ca
    userPinSecretRef:
      name: tpm2-pkcs11-pin
      namespace: sovereignite-system
      key: user-pin
  profiles:
    default:
      maxDuration: 43800h
      isCA: true
      maxPathLen: 1
      usages:
        - digital signature
        - key encipherment
        - cert sign
        - crl sign
  requestPolicy:
    requireApprovedCondition: true
    denyCARequests: false
---
