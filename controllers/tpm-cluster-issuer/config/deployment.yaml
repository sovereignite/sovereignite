apiVersion: apps/v1
kind: Deployment
metadata:
  name: tpm-cluster-issuer
  namespace: sovereignite-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tpm-cluster-issuer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tpm-cluster-issuer
    spec:
      serviceAccountName: tpm-cluster-issuer
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: ghcr.io/sovereignite/tpm-cluster-issuer:v0.1.0
          args:
            - --issuer-group=pki.sovereignite.io
            - --issuer-kind=TPMClusterIssuer
            - --leader-election-namespace=sovereignite-system
            - --default-profile=default
          env:
            - name: TPM2_PKCS11_STORE
              value: /var/lib/sovereignite/tpm2-pkcs11
            - name: TPM2TOOLS_TCTI
              value: device:/dev/tpmrm0
            - name: TSS2_TCTI
              value: device:/dev/tpmrm0
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tpmrm
              mountPath: /dev/tpmrm0
            - name: tpm2-pkcs11
              mountPath: /var/lib/sovereignite/tpm2-pkcs11
              readOnly: true
      volumes:
        - name: tpmrm
          hostPath:
            path: /dev/tpmrm0
            type: CharDevice
        - name: tpm2-pkcs11
          hostPath:
            path: /var/lib/sovereignite/tpm2-pkcs11
            type: Directory
