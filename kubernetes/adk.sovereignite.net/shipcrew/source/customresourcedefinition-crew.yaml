apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crews.adk.sovereignite.net
spec:
  group: adk.sovereignite.net
  names:
    kind: Crew
    listKind: CrewList
    plural: crews
    singular: crew
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.modelRef
        - name: Members
          type: integer
          jsonPath: .spec.members
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          description: Crew describes a team of ADK agents.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - modelRef
                - members
              properties:
                modelRef:
                  type: string
                  description: Name of the ModelBackend resource.
                members:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - mode
                    properties:
                      name:
                        type: string
                      mode:
                        type: string
                        enum:
                          - chat
                          - task
                          - single_turn
                      description:
                        type: string
                      instruction:
                        type: string
                      tools:
                        type: array
                        items:
                          type: string
                remoteWorkers:
                  type: array
                  items:
                    type: object
                    required:
                      - name
                      - agentCardURL
                    properties:
                      name:
                        type: string
                      description:
                        type: string
                      agentCardURL:
                        type: string
            status:
              type: object
              properties:
                ready:
                  type: boolean
                activeRunID:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
