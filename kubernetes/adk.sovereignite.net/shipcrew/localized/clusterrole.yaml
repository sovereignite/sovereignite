apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: shipcrew-controller
rules:
  - apiGroups: ["adk.sovereignite.net"]
    resources: ["modelbackends", "crews", "crewruns", "mcpservers"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["adk.sovereignite.net"]
    resources: ["modelbackends/status", "crews/status", "crewruns/status", "mcpservers/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
