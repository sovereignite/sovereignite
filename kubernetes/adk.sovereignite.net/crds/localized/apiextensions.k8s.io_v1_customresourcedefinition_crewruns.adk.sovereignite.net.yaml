apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crewruns.adk.sovereignite.net
spec:
  group: adk.sovereignite.net
  names:
    kind: CrewRun
    listKind: CrewRunList
    plural: crewruns
    singular: crewrun
    shortNames:
      - crun
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Crew
          type: string
          jsonPath: .spec.crewRef
        - name: User
          type: string
          jsonPath: .spec.userID
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          description: CrewRun represents a single execution request against a Crew.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - crewRef
                - userID
                - message
              properties:
                crewRef:
                  type: string
                  description: Name of the Crew resource to execute.
                userID:
                  type: string
                  description: User identifier for session namespacing.
                sessionID:
                  type: string
                  description: Session identifier. Auto-generated if empty.
                message:
                  type: object
                  properties:
                    text:
                      type: string
                    parts:
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                streamingMode:
                  type: string
                  enum:
                    - none
                    - sse
                saveInputBlobsAsArtifacts:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Running
                    - Succeeded
                    - Failed
                sessionID:
                  type: string
                events:
                  type: array
                  items:
                    type: object
                    x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
