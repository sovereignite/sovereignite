apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: modelbackends.adk.sovereignite.net
spec:
  group: adk.sovereignite.net
  names:
    kind: ModelBackend
    listKind: ModelBackendList
    plural: modelbackends
    singular: modelbackend
    shortNames:
      - mb
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Provider
          type: string
          jsonPath: .spec.provider
        - name: Model
          type: string
          jsonPath: .spec.model
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          description: ModelBackend describes a model backend for ADK agents.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - provider
                - model
              properties:
                provider:
                  type: string
                  enum:
                    - gemini
                    - openai
                    - ollama
                  description: The model backend type.
                model:
                  type: string
                  description: "Model identifier (e.g. gemini-2.0-flash, gpt-4o, llama3.1)."
                baseURL:
                  type: string
                  description: Override endpoint URL (required for ollama, optional for openai).
                apiKeyRef:
                  type: object
                  properties:
                    name:
                      type: string
                    key:
                      type: string
                  required:
                    - name
                    - key
                  description: Reference to a Kubernetes Secret containing the API key.
            status:
              type: object
              properties:
                ready:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
