apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: crews.adk.sovereignite.net
spec:
  group: adk.sovereignite.net
  names:
    kind: Crew
    listKind: CrewList
    plural: crews
    singular: crew
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Model
          type: string
          jsonPath: .spec.modelRef
        - name: Members
          type: integer
          jsonPath: .spec.members
        - name: Ready
          type: boolean
          jsonPath: .status.ready
      schema:
        openAPIV3Schema:
          type: object
          description: Crew describes a team of ADK LlmAgents backed by a runner.
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required:
                - modelRef
                - members
              properties:
                appName:
                  type: string
                  description: Application name for session namespacing. Defaults to Crew name.
                modelRef:
                  type: string
                  description: Name of the default ModelBackend resource.
                members:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - name
                      - mode
                    properties:
                      name:
                        type: string
                        minLength: 1
                      description:
                        type: string
                      mode:
                        type: string
                        enum:
                          - chat
                          - task
                          - single_turn
                      modelRef:
                        type: string
                        description: Per-member ModelBackend override.
                      instruction:
                        type: string
                      subAgents:
                        type: array
                        items:
                          type: string
                      tools:
                        type: array
                        items:
                          type: string
                      toolsets:
                        type: array
                        items:
                          type: string
                      outputKey:
                        type: string
                      generateContentConfig:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      inputSchema:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      outputSchema:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
                      includeContents:
                        type: string
                        enum:
                          - default
                          - none
                      disallowTransferToParent:
                        type: boolean
                      disallowTransferToPeers:
                        type: boolean
            status:
              type: object
              properties:
                ready:
                  type: boolean
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
