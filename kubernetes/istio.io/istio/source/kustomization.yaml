apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: istio-system
resources:
- namespace.yaml
- spire-integration-config.yaml
helmCharts:
- name: base
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.30.3
  releaseName: istio-base
  namespace: istio-system
  includeCRDs: true
- name: istiod
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.30.3
  releaseName: istiod
  namespace: istio-system
  includeCRDs: true
  valuesInline:
    meshConfig:
      accessLogFile: /dev/stdout
      defaultConfig:
        holdApplicationUntilProxyStarts: true
      trustDomain: sovereignite.local
    pilot:
      env:
        ENABLE_NATIVE_SIDECARS: "true"
    global:
      caAddress: ""
      meshID: sovereignite
      multiCluster:
        clusterName: sovereignite
      proxy:
        privileged: false
- name: gateway
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.30.3
  releaseName: istio-ingressgateway
  namespace: istio-system
- name: gateway
  repo: https://istio-release.storage.googleapis.com/charts
  version: 1.30.3
  releaseName: istio-egressgateway
  namespace: istio-system
  valuesInline:
    service:
      type: ClusterIP
