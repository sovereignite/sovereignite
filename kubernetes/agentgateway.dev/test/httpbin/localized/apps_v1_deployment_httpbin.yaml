apiVersion: apps/v1
kind: Deployment
metadata:
  name: httpbin
  namespace: httpbin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: httpbin
      version: v1
  template:
    metadata:
      labels:
        app: httpbin
        version: v1
    spec:
      containers:
      - args:
        - -port
        - "8080"
        - -max-duration
        - 600s
        command:
        - go-httpbin
        image: docker.io/mccutchen/go-httpbin:v2.6.0
        imagePullPolicy: IfNotPresent
        name: httpbin
        ports:
        - containerPort: 8080
      - command:
        - tail
        - -f
        - /dev/null
        image: curlimages/curl:7.83.1
        imagePullPolicy: IfNotPresent
        name: curl
        resources:
          limits:
            cpu: 200m
          requests:
            cpu: 100m
      serviceAccountName: httpbin
