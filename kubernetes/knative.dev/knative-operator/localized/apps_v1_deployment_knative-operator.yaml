apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/name: knative-operator
    app.kubernetes.io/version: 1.22.1
  name: knative-operator
  namespace: knative-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      name: knative-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: knative-operator
        app.kubernetes.io/version: 1.22.1
        name: knative-operator
        sidecar.istio.io/inject: "false"
    spec:
      containers:
      - env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: SYSTEM_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: METRICS_DOMAIN
          value: knative.dev/operator
        - name: CONFIG_LOGGING_NAME
          value: config-logging
        - name: CONFIG_OBSERVABILITY_NAME
          value: config-observability
        - name: KUBERNETES_MIN_VERSION
          value: ""
        image: gcr.io/knative-releases/knative.dev/operator/cmd/operator@sha256:ea30f1ce8dc4e2831d00e1b113db1350bc2c1584567135ce68571d065c3bdd7d
        imagePullPolicy: IfNotPresent
        name: knative-operator
        ports:
        - containerPort: 9090
          name: metrics
        resources:
          limits:
            cpu: 1000m
            memory: 1000Mi
          requests:
            cpu: 100m
            memory: 100Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsNonRoot: true
      serviceAccountName: knative-operator
