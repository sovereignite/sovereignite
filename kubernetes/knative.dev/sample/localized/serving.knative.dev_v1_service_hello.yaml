apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: hello
  namespace: sample-knative
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/min-scale: "0"
    spec:
      containers:
      - env:
        - name: TARGET
          value: sovereignite
        image: gcr.io/knative-samples/helloworld-go
