apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spire-server
  namespace: spire
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-server
  serviceName: spire-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-server
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app.kubernetes.io/name: spire-server
            topologyKey: kubernetes.io/hostname
      containers:
      - args:
        - run
        - -config
        - /run/spire/config/server.conf
        command:
        - /opt/spire/bin/spire-server
        env:
        - name: TPM2_PKCS11_STORE
          value: /var/lib/sovereignite/tpm2-pkcs11
        - name: TPM2TOOLS_TCTI
          value: device:/dev/tpmrm0
        - name: TSS2_TCTI
          value: device:/dev/tpmrm0
        - name: TPM_PKCS11_PIN
          valueFrom:
            secretKeyRef:
              key: user-pin
              name: tpm2-pkcs11-pin
        image: ghcr.io/sovereignite/spire-server-tpm:1.15.2-sovereignite.0
        name: spire-server
        ports:
        - containerPort: 8081
          name: grpc
        securityContext:
          privileged: true
          runAsGroup: 0
          runAsUser: 0
        volumeMounts:
        - mountPath: /run/spire/config
          name: config
          readOnly: true
        - mountPath: /run/spire/tpm-attestor-ca
          name: tpm-attestor-ca
          readOnly: true
        - mountPath: /run/spire/data
          name: data
        - mountPath: /var/lib/sovereignite/tpm2-pkcs11
          name: tpm2-pkcs11
        - mountPath: /run/spire/sockets
          name: spire-server-socket
        - mountPath: /run/spire-tpm-keymanager
          name: tpm-keymanager-socket
        - mountPath: /dev/tpmrm0
          name: tpmrm
      - args:
        - --config=/run/spire-controller-manager/config/controller-manager-config.yaml
        env:
        - name: ENABLE_WEBHOOKS
          value: "false"
        image: ghcr.io/spiffe/spire-controller-manager:0.7.0
        livenessProbe:
          httpGet:
            path: /healthz
            port: healthz
          initialDelaySeconds: 15
          periodSeconds: 20
        name: spire-controller-manager
        ports:
        - containerPort: 8083
          name: healthz
        readinessProbe:
          httpGet:
            path: /readyz
            port: healthz
          initialDelaySeconds: 5
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          runAsGroup: 0
          runAsNonRoot: true
          runAsUser: 65532
        volumeMounts:
        - mountPath: /run/spire-controller-manager/config
          name: controller-manager-config
          readOnly: true
        - mountPath: /run/spire/sockets
          name: spire-server-socket
      nodeSelector:
        kubernetes.io/hostname: cp-1
        node-role.kubernetes.io/control-plane: ""
      serviceAccountName: spire-server
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - configMap:
          name: spire-server-config
        name: config
      - configMap:
          name: spire-controller-manager-config
        name: controller-manager-config
      - configMap:
          name: spire-tpm-attestor-ca
        name: tpm-attestor-ca
      - hostPath:
          path: /var/lib/sovereignite/spire-server
          type: DirectoryOrCreate
        name: data
      - hostPath:
          path: /var/lib/sovereignite/tpm2-pkcs11
          type: Directory
        name: tpm2-pkcs11
      - emptyDir: {}
        name: spire-server-socket
      - emptyDir: {}
        name: tpm-keymanager-socket
      - hostPath:
          path: /dev/tpmrm0
          type: CharDevice
        name: tpmrm
