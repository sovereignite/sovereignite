apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spire-server-bundle-publisher
  namespace: spire
rules:
- apiGroups:
  - ""
  resourceNames:
  - spire-agent-bundle
  resources:
  - configmaps
  verbs:
  - get
  - patch
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - create
