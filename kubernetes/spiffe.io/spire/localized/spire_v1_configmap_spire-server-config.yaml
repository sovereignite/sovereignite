apiVersion: v1
data:
  server.conf: |
    server {
      bind_address = "0.0.0.0"
      bind_port = "8081"
      trust_domain = "sovereignite.local"
      data_dir = "/run/spire/data"
      socket_path = "/run/spire/sockets/server-api.sock"
      log_level = "INFO"
      ca_ttl = "24h"
      default_x509_svid_ttl = "1h"
    }

    plugins {
      DataStore "sql" {
        plugin_data {
          database_type = "sqlite3"
          connection_string = "/run/spire/data/datastore.sqlite3"
        }
      }

      KeyManager "external" {
        plugin_cmd = "/opt/spire/plugins/spire-tpm-keymanager"
        plugin_data {
          socket_path = "/run/spire-tpm-keymanager/keymanager.sock"
          module_path = "/usr/lib64/pkcs11/libtpm2_pkcs11.so"
          token_label = "sovereignite-ca"
          key_label_prefix = "sovereignite-spire-"
        }
      }

      NodeAttestor "tpm_devid" {
        plugin_data {
          devid_ca_path = "/run/spire/tpm-attestor-ca/tpm-devid-ca.pem"
          endorsement_ca_path = "/run/spire/tpm-attestor-ca/tpm-endorsement-ca.pem"
        }
      }

      BundlePublisher "k8s_configmap" {
        plugin_data {
          clusters = {
            "sovereignite" = {
              configmap_name = "spire-agent-bundle"
              configmap_key = "bundle.crt"
              namespace = "spire"
              format = "pem"
            }
          }
        }
      }
    }
kind: ConfigMap
metadata:
  name: spire-server-config
  namespace: spire
