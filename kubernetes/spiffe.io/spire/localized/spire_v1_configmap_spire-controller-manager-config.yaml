apiVersion: v1
data:
  controller-manager-config.yaml: |
    apiVersion: spire.spiffe.io/v1alpha1
    kind: ControllerManagerConfig
    clusterName: sovereignite
    trustDomain: sovereignite.local
    clusterDomain: cluster.local
    parentIDTemplate: spiffe://{{ .TrustDomain }}/nodes/{{ .NodeMeta.Name }}
    watchClassless: true
    ignoreNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - spire
    validatingWebhookConfigurationName: spire-controller-manager-webhook-disabled
    spireServerSocketPath: /run/spire/sockets/server-api.sock
    logLevel: debug
    logEncoding: json
    reconcile:
      clusterSPIFFEIDs: true
      clusterFederatedTrustDomains: true
      clusterStaticEntries: true
    metrics:
      bindAddress: 127.0.0.1:8084
    health:
      healthProbeBindAddress: :8083
kind: ConfigMap
metadata:
  name: spire-controller-manager-config
  namespace: spire
