apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: spire-agent
  namespace: spire
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-agent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-agent
    spec:
      containers:
      - args:
        - -config
        - /run/spire/config/agent.conf
        env:
        - name: TPM2TOOLS_TCTI
          value: device:/dev/tpmrm0
        - name: TSS2_TCTI
          value: device:/dev/tpmrm0
        image: ghcr.io/spiffe/spire-agent:1.15.2
        name: spire-agent
        securityContext:
          privileged: true
        volumeMounts:
        - mountPath: /run/spire/config
          name: config
          readOnly: true
        - mountPath: /run/spire/bundle
          name: trust-bundle
          readOnly: true
        - mountPath: /run/spire/sockets
          name: spire-sockets
        - mountPath: /dev/tpmrm0
          name: tpmrm
        - mountPath: /var/lib/sovereignite/tpm
          name: sovereignite-tpm
          readOnly: true
      dnsPolicy: ClusterFirstWithHostNet
      hostNetwork: true
      hostPID: true
      serviceAccountName: spire-agent
      tolerations:
      - effect: NoSchedule
        key: node-role.kubernetes.io/control-plane
        operator: Exists
      volumes:
      - configMap:
          name: spire-agent-config
        name: config
      - configMap:
          name: spire-agent-bundle
        name: trust-bundle
      - hostPath:
          path: /run/spire/sockets
          type: DirectoryOrCreate
        name: spire-sockets
      - hostPath:
          path: /dev/tpmrm0
          type: CharDevice
        name: tpmrm
      - hostPath:
          path: /var/lib/sovereignite/tpm
          type: Directory
        name: sovereignite-tpm
