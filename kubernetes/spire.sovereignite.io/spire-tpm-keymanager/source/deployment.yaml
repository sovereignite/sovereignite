apiVersion: apps/v1
kind: Deployment
metadata:
  name: spire-tpm-keymanager
  namespace: sovereignite-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spire-tpm-keymanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spire-tpm-keymanager
    spec:
      serviceAccountName: spire-tpm-keymanager
      nodeSelector:
        node-role.kubernetes.io/control-plane: ""
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: controller
          image: ghcr.io/sovereignite/spire-tpm-keymanager-controller:v0.1.0
          args:
            - --leader-election-namespace=sovereignite-system
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL