apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: spiretpmkeymanagers.spire.sovereignite.io
spec:
  group: spire.sovereignite.io
  scope: Namespaced
  names:
    plural: spiretpmkeymanagers
    singular: spiretpmkeymanager
    kind: SPIRETPMKeyManager
    shortNames:
      - spiretpmkm
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - name: Socket
          type: string
          jsonPath: .spec.socketPath
        - name: Token
          type: string
          jsonPath: .spec.pkcs11.tokenLabel
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required:
            - spec
          properties:
            spec:
              type: object
              required:
                - socketPath
                - pkcs11
                - keys
              properties:
                socketPath:
                  type: string
                  minLength: 1
                pkcs11:
                  type: object
                  required:
                    - modulePath
                    - tokenLabel
                  properties:
                    modulePath:
                      type: string
                    tokenLabel:
                      type: string
                    userPinSecretRef:
                      type: object
                      required:
                        - name
                        - key
                      properties:
                        name:
                          type: string
                        key:
                          type: string
                keys:
                  type: object
                  required:
                    - upstreamCA
                    - serverCA
                  properties:
                    upstreamCA:
                      type: string
                    serverCA:
                      type: string
                rotation:
                  type: object
                  properties:
                    svidTtl:
                      type: string
                    caTtl:
                      type: string
                    rotationWindow:
                      type: string
            status:
              type: object
              properties:
                observedGeneration:
                  type: integer
                  format: int64
                activeKeyLabel:
                  type: string
                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                        enum:
                          - "True"
                          - "False"
                          - Unknown
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
      subresources:
        status: {}