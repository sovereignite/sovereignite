apiVersion: adk.sovereignite.net/v1alpha1
kind: MCPServer
metadata:
  name: siem-tools
  namespace: blue-crew
spec:
  endpoint: https://mcp.example.com/siem
  requireConfirmation: false
  toolFilter:
    allow:
    - query_logs
    - search_iocs
    - list_alerts
    - get_alert_details
    - enrich_ioc
  transport: streamable-http
