apiVersion: adk.sovereignite.net/v1alpha1
kind: MCPServer
metadata:
  name: hardening-tools
  namespace: blue-crew
spec:
  transport: streamable-http
  endpoint: https://mcp.example.com/hardening
  requireConfirmation: true
  toolFilter:
    allow:
      - audit_config
      - check_compliance
      - generate_policy
      - validate_rules
