apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - crds
  - controller

labels:
  - pairs:
      app.kubernetes.io/name: shipcrew
      app.kubernetes.io/part-of: adk
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false

images:
  - name: ghcr.io/sovereignite/shipcrew
    newName: ghcr.io/sovereignite/shipcrew
    newTag: latest
