---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: workflows.adk.sovereignite.net
spec:
  group: adk.sovereignite.net
  names:
    kind: Workflow
    listKind: WorkflowList
    plural: workflows
    shortNames:
    - wf
    singular: workflow
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.nodeCount
      name: Nodes
      type: integer
    - jsonPath: .status.ready
      name: Ready
      type: boolean
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Workflow describes a graph-based workflow of agents and execution
          nodes.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: WorkflowSpec defines a graph-based workflow of agents and
              nodes.
            properties:
              edges:
                description: Edges defines the connections between nodes.
                items:
                  description: WorkflowEdge connects two nodes in the workflow graph.
                  properties:
                    condition:
                      description: Condition is an optional routing condition (for
                        route nodes).
                      type: string
                    from:
                      description: From is the source node name. Use "START" for the
                        entry point.
                      type: string
                    to:
                      description: To is the destination node name.
                      type: string
                  required:
                  - from
                  - to
                  type: object
                minItems: 1
                type: array
              modelRef:
                description: ModelRef references a ModelBackend for agent nodes that
                  don't specify one.
                type: string
              nodes:
                description: Nodes defines the execution nodes in the workflow graph.
                items:
                  description: WorkflowNode is a single node in the workflow graph.
                  properties:
                    agentRef:
                      description: AgentRef references a CrewMember by name (for agent
                        nodes).
                      type: string
                    function:
                      description: Function is the function name to call (for function
                        nodes).
                      type: string
                    hitl:
                      description: HITL configures human-in-the-loop behavior (for
                        hitl nodes).
                      properties:
                        interruptID:
                          description: InterruptID identifies this HITL pause point.
                          type: string
                        message:
                          description: Message is the prompt displayed to the user.
                          type: string
                      type: object
                    name:
                      description: Name uniquely identifies this node.
                      type: string
                    route:
                      description: Route configures conditional routing (for route
                        nodes).
                      properties:
                        field:
                          description: Field is the output field to route on.
                          type: string
                      type: object
                    type:
                      description: Type is the node type.
                      enum:
                      - agent
                      - function
                      - hitl
                      - route
                      - join
                      type: string
                  required:
                  - name
                  - type
                  type: object
                minItems: 1
                type: array
            required:
            - edges
            - nodes
            type: object
          status:
            description: WorkflowStatus is the observed state of a Workflow.
            properties:
              conditions:
                description: Conditions represent the latest available observations.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              nodeCount:
                description: NodeCount is the number of nodes in the workflow.
                type: integer
              ready:
                description: Ready indicates whether the workflow is valid and can
                  execute.
                type: boolean
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
