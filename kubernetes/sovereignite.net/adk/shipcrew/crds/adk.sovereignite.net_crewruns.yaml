              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              CrewRunSpec defines a single execution request against a Crew.
              Maps to a runner.Run() invocation.
            properties:
