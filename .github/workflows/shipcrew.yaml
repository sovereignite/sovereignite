name: Build shipcrew

on:
  push:
    branches: [master]
    paths:
      - 'internal/shipcrew/**'
      - '.github/workflows/shipcrew.yaml'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    branches: [master]
    paths:
      - 'internal/shipcrew/**'
      - '.github/workflows/shipcrew.yaml'
      - 'go.mod'
      - 'go.sum'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          args: ./internal/shipcrew/...

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Test
        run: gotestsum --junitfile reports/tests.xml --format standard-verbose -- -short ./internal/shipcrew/...

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: reports/tests.xml

  vulncheck:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          work-dir: .
          repo-checkout: false

  notify-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [lint, test, vulncheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Build failed: shipcrew (${context.sha.substring(0, 7)})`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure', 'shipcrew']
            })
