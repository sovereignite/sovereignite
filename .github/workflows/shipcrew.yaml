name: shipcrew

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/shipcrew/... ./internal/shipcrew/...

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/shipcrew/...

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: "Build"
        id: build
        uses: ./.github/actions/ko-build
        with:
          import-path: ./cmd/shipcrew

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Scan"
        uses: ./.github/actions/image-scan
        with:
          image: ${{ needs.build.outputs.image }}
          digest: ${{ needs.build.outputs.digest }}

  sign:
    needs: [build, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Sign"
        uses: ./.github/actions/image-sign
        with:
          image: ${{ needs.build.outputs.image }}
          digest: ${{ needs.build.outputs.digest }}

  attest:
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Attest"
        uses: ./.github/actions/image-attest
        with:
          image: ${{ needs.build.outputs.image }}
          digest: ${{ needs.build.outputs.digest }}

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Render"
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Validate"
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Policy"
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Provenance"
        uses: ./.github/actions/kpt-provenance
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  notify-failure:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [lint, test, build, scan, sign, attest, package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: shipcrew (${{ github.sha }})"
          labels: "ci-failure,shipcrew"
