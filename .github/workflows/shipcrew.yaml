name: shipcrew

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  discover:
    uses: ./.github/workflows/discover-components.yaml

  lint:
    needs: discover
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/... ./internal/... ./controllers/...

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/...

  build-go:
    needs: [test, discover]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover.outputs.go-commands) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  build-controllers:
    needs: [test, discover]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover.outputs.controllers) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  build-kpt:
    needs: [test, discover]
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover.outputs.kpt-functions) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./kubernetes/sovereignite.net/kpt-functions/${{ matrix.function }}

  render:
    needs: [build-go, build-controllers, build-kpt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Render"
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  validate:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Validate"
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  policy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Policy"
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  provenance:
    needs: [policy, build-kpt]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover.outputs.kpt-functions) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Provenance"
        uses: ./.github/actions/kpt-provenance
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew
          image: ${{ needs.build-kpt.outputs.image }}@${{ needs.build-kpt.outputs.digest }}

  notify-failure:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [discover, lint, test, build-go, build-controllers, build-kpt, render, validate, policy, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: shipcrew (${{ github.sha }})"
          labels: "ci-failure,shipcrew"
