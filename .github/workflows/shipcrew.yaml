name: shipcrew

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/shipcrew/... ./internal/shipcrew/...

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/shipcrew/...

  build-app:
    needs: test
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./cmd/shipcrew

  build-kpt-fn:
    needs: test
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./kubernetes/sovereignite.net/kpt-functions/provenance

  render:
    needs: [build-app, build-kpt-fn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Render"
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  validate:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Validate"
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  policy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Policy"
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  provenance:
    needs: [policy, build-kpt-fn]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup"
        uses: ./.github/actions/kpt-setup

      - name: "Provenance"
        uses: ./.github/actions/kpt-provenance
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew
          image: ${{ needs.build-kpt-fn.outputs.image }}@${{ needs.build-kpt-fn.outputs.digest }}

  notify-failure:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [lint, test, build-app, build-kpt-fn, render, validate, policy, provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: shipcrew (${{ github.sha }})"
          labels: "ci-failure,shipcrew"
