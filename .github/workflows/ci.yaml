name: CI

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  discover-go:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.discover.outputs.commands }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-go-commands

  discover-controllers:
    runs-on: ubuntu-latest
    outputs:
      controllers: ${{ steps.discover.outputs.controllers }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-controllers

  discover-kpt:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.discover.outputs.functions }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-kpt-functions

  discover-libraries:
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.discover.outputs.libraries }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-libraries

  lint-libraries:
    needs: discover-libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./internal/${{ matrix.library }}/...

  test-libraries:
    needs: [lint-libraries, discover-libraries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/${{ matrix.library }}/...

  go-command:
    needs: discover-go
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  controller:
    needs: discover-controllers
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd
      lint-path: ./controllers/${{ matrix.controller }}/...

  kpt-function:
    needs: discover-kpt
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./${{ matrix.function }}

  kpt-render:
    needs: kpt-function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Render"
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  kpt-validate:
    needs: kpt-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Validate kubeconform"
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Validate gatekeeper"
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  kpt-provenance:
    needs: kpt-function
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Provenance"
        uses: ./.github/actions/kpt-provenance
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew
          image: ${{ needs.kpt-function.outputs.image }}@${{ needs.kpt-function.outputs.digest }}

  notify-failure:
    if: failure()
    needs: [discover-go, discover-controllers, discover-kpt, discover-libraries, lint-libraries, test-libraries, go-command, controller, kpt-function, kpt-render, kpt-validate, kpt-provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: CI (${{ github.sha }})"
          labels: "ci-failure"
