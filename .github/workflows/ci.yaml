name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  discover:
    uses: ./.github/workflows/discover-components.yaml

  lint-go:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover.outputs.go-commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/${{ matrix.command }}/...

  lint-controllers:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  lint-libraries:
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./internal/${{ matrix.library }}/...

  test-go:
    needs: lint-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover.outputs.go-commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./cmd/${{ matrix.command }}/...

  test-controllers:
    needs: lint-controllers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  test-libraries:
    needs: lint-libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/${{ matrix.library }}/...

  go-command:
    needs: [test-go, discover]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover.outputs.go-commands) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  controller:
    needs: [test-controllers, discover]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover.outputs.controllers) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  kpt-function:
    needs: discover
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover.outputs.kpt-functions) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./kubernetes/sovereignite.net/kpt-functions/${{ matrix.function }}

  notify-failure:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [discover, lint-go, lint-controllers, lint-libraries, test-go, test-controllers, test-libraries, go-command, controller, kpt-function]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: CI (${{ github.sha }})"
          labels: "ci-failure"
