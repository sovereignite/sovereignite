name: CI

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  discover-go:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.discover.outputs.commands }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-go-commands

  discover-controllers:
    runs-on: ubuntu-latest
    outputs:
      controllers: ${{ steps.discover.outputs.controllers }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-controllers

  discover-kpt:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.discover.outputs.functions }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-kpt-functions

  discover-libraries:
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.discover.outputs.libraries }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-libraries

  lint-go:
    needs: discover-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/${{ matrix.command }}/...

  lint-controllers:
    needs: discover-controllers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  lint-libraries:
    needs: discover-libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./internal/${{ matrix.library }}/...

  test-go:
    needs: [lint-go, discover-go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./cmd/${{ matrix.command }}/...

  test-controllers:
    needs: [lint-controllers, discover-controllers]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  test-libraries:
    needs: [lint-libraries, discover-libraries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/${{ matrix.library }}/...

  go-command:
    needs: [test-go, discover-go]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  controller:
    needs: [test-controllers, discover-controllers]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  kpt-function:
    needs: discover-kpt
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-pipeline.yaml
    with:
      import-path: ./kubernetes/sovereignite.net/kpt-functions/${{ matrix.function }}

  notify-failure:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [discover-go, discover-controllers, discover-kpt, discover-libraries, lint-go, lint-controllers, lint-libraries, test-go, test-controllers, test-libraries, go-command, controller, kpt-function]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: CI (${{ github.sha }})"
          labels: "ci-failure"
