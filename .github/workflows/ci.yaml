name: CI

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  artifact-metadata: write
  security-events: write
  issues: write

jobs:
  discover-go:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.discover.outputs.commands }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-go-commands

  discover-controllers:
    runs-on: ubuntu-latest
    outputs:
      controllers: ${{ steps.discover.outputs.controllers }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-controllers

  discover-kpt:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.discover.outputs.functions }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-kpt-functions

  discover-libraries:
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.discover.outputs.libraries }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-libraries

  # ─── LINT ────────────────────────────────────────────────────────────
  lint-go:
    needs: discover-go
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/${{ matrix.command }}/...

  lint-controllers:
    needs: discover-controllers
    runs-on: ubuntu-latest
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  lint-kpt:
    needs: discover-kpt
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./${{ matrix.function }}/...

  lint-libraries:
    needs: discover-libraries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./internal/${{ matrix.library }}/...

  # ─── TEST ────────────────────────────────────────────────────────────
  test-go:
    needs: [lint-go, discover-go]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./cmd/${{ matrix.command }}/...

  test-controllers:
    needs: [lint-controllers, discover-controllers]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  test-kpt:
    needs: [lint-kpt, discover-kpt]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./${{ matrix.function }}/...

  test-libraries:
    needs: [lint-libraries, discover-libraries]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/${{ matrix.library }}/...

  # ─── BUILD ───────────────────────────────────────────────────────────
  build-go:
    needs: [test-go, discover-go]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  build-controllers:
    needs: [test-controllers, discover-controllers]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  build-kpt:
    needs: [test-kpt, discover-kpt]
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      import-path: ./${{ matrix.function }}

  # ─── SCAN ────────────────────────────────────────────────────────────
  scan-go:
    needs: [build-go, discover-go]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-scan.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  scan-controllers:
    needs: [build-controllers, discover-controllers]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-scan.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  scan-kpt:
    needs: [build-kpt, discover-kpt]
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-scan.yaml
    with:
      import-path: ./${{ matrix.function }}

  # ─── SIGN ────────────────────────────────────────────────────────────
  sign-go:
    needs: [scan-go, discover-go]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-sign.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  sign-controllers:
    needs: [scan-controllers, discover-controllers]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-sign.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  sign-kpt:
    needs: [scan-kpt, discover-kpt]
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-sign.yaml
    with:
      import-path: ./${{ matrix.function }}

  # ─── ATTEST ──────────────────────────────────────────────────────────
  attest-go:
    needs: [sign-go, discover-go]
    strategy:
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-attest.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  attest-controllers:
    needs: [sign-controllers, discover-controllers]
    strategy:
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-attest.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd

  attest-kpt:
    needs: [sign-kpt, discover-kpt]
    strategy:
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-attest.yaml
    with:
      import-path: ./${{ matrix.function }}

  # ─── KPT FUNCTIONS ───────────────────────────────────────────────────
  kpt-render:
    needs: attest-kpt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Render"
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  kpt-validate:
    needs: kpt-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Validate kubeconform"
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Validate gatekeeper"
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  kpt-provenance:
    needs: attest-kpt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Compute artifact name"
        id: artifact
        run: echo "name=$(echo 'kubernetes/sovereignite.net/kpt-functions/provenance' | sed 's|/|-|g; s|^-||; s|-$||')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Download image ref"
        uses: actions/download-artifact@v7
        with:
          name: image-ref-${{ steps.artifact.outputs.name }}
          path: /tmp/image-ref/

      - name: "Read image ref"
        id: ref
        run: |
          echo "image=$(cat /tmp/image-ref/image)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat /tmp/image-ref/digest)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Provenance"
        uses: ./.github/actions/kpt-provenance
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew
          image: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}

  notify-failure:
    if: failure()
    needs: [discover-go, discover-controllers, discover-kpt, discover-libraries, lint-go, lint-controllers, lint-kpt, lint-libraries, test-go, test-controllers, test-kpt, test-libraries, build-go, build-controllers, build-kpt, scan-go, scan-controllers, scan-kpt, sign-go, sign-controllers, sign-kpt, attest-go, attest-controllers, attest-kpt, kpt-render, kpt-validate, kpt-provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: CI (${{ github.sha }})"
          labels: "ci-failure"
