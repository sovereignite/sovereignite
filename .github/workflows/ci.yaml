name: CI

on:
  push:
    branches: [master, 'feature/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/heads/feature/') }}

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  issues: write

jobs:
  discover-go:
    runs-on: ubuntu-latest
    outputs:
      commands: ${{ steps.discover.outputs.commands }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-go-commands

  discover-controllers:
    runs-on: ubuntu-latest
    outputs:
      controllers: ${{ steps.discover.outputs.controllers }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-controllers

  discover-kpt:
    runs-on: ubuntu-latest
    outputs:
      functions: ${{ steps.discover.outputs.functions }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-kpt-functions

  discover-libraries:
    runs-on: ubuntu-latest
    outputs:
      libraries: ${{ steps.discover.outputs.libraries }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        uses: ./.github/actions/discover-libraries

  # ─── LINT ────────────────────────────────────────────────────────────
  lint-go:
    needs: discover-go
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./cmd/${{ matrix.command }}/...

  lint-controllers:
    needs: discover-controllers
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  lint-kpt:
    needs: discover-kpt
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./${{ matrix.function }}/...

  lint-libraries:
    needs: discover-libraries
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Lint"
        uses: ./.github/actions/lint
        with:
          paths: ./internal/${{ matrix.library }}/...

  # ─── TEST ────────────────────────────────────────────────────────────
  test-go:
    needs: [lint-go, discover-go]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./cmd/${{ matrix.command }}/...

  test-controllers:
    needs: [lint-controllers, discover-controllers]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./controllers/${{ matrix.controller }}/...

  test-kpt:
    needs: [lint-kpt, discover-kpt]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./${{ matrix.function }}/...

  test-libraries:
    needs: [lint-libraries, discover-libraries]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        library: ${{ fromJson(needs.discover-libraries.outputs.libraries) }}
    steps:
      - uses: actions/checkout@v7

      - name: "Test"
        uses: ./.github/actions/test
        with:
          paths: ./internal/${{ matrix.library }}/...

  quality-gate:
    if: always()
    needs: [test-go, test-controllers, test-kpt, test-libraries]
    runs-on: ubuntu-latest
    steps:
      - name: "Require all test matrices to pass"
        if: >-
          ${{
            needs.test-go.result != 'success' ||
            needs.test-controllers.result != 'success' ||
            needs.test-kpt.result != 'success' ||
            needs.test-libraries.result != 'success'
          }}
        run: |
          echo "One or more quality matrices did not pass."
          exit 1

  # ─── BUILD ───────────────────────────────────────────────────────────
  build-go:
    needs: [quality-gate, discover-go]
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  build-controllers:
    needs: [quality-gate, discover-controllers]
    strategy:
      fail-fast: true
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd/${{ matrix.controller }}

  build-kpt:
    needs: [quality-gate, discover-kpt]
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-build.yaml
    with:
      import-path: ./${{ matrix.function }}

  build-gate:
    if: always()
    needs: [build-go, build-controllers, build-kpt]
    runs-on: ubuntu-latest
    steps:
      - name: "Require all build matrices to pass"
        if: >-
          ${{
            needs.build-go.result != 'success' ||
            needs.build-controllers.result != 'success' ||
            needs.build-kpt.result != 'success'
          }}
        run: |
          echo "One or more image build matrices did not pass."
          exit 1

  # ─── SCAN ────────────────────────────────────────────────────────────
  scan-go:
    needs: [build-gate, discover-go]
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-scan.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  scan-controllers:
    needs: [build-gate, discover-controllers]
    strategy:
      fail-fast: true
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-scan.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd/${{ matrix.controller }}

  scan-kpt:
    needs: [build-gate, discover-kpt]
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-scan.yaml
    with:
      import-path: ./${{ matrix.function }}

  scan-gate:
    if: always()
    needs: [scan-go, scan-controllers, scan-kpt]
    runs-on: ubuntu-latest
    steps:
      - name: "Require all scan matrices to pass"
        if: >-
          ${{
            needs.scan-go.result != 'success' ||
            needs.scan-controllers.result != 'success' ||
            needs.scan-kpt.result != 'success'
          }}
        run: |
          echo "One or more image scan matrices did not pass."
          exit 1

  # ─── SIGN ────────────────────────────────────────────────────────────
  sign-go:
    if: github.ref == 'refs/heads/master'
    needs: [scan-gate, discover-go]
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-sign.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  sign-controllers:
    if: github.ref == 'refs/heads/master'
    needs: [scan-gate, discover-controllers]
    strategy:
      fail-fast: true
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-sign.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd/${{ matrix.controller }}

  sign-kpt:
    if: github.ref == 'refs/heads/master'
    needs: [scan-gate, discover-kpt]
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-sign.yaml
    with:
      import-path: ./${{ matrix.function }}

  sign-gate:
    if: always()
    needs: [sign-go, sign-controllers, sign-kpt]
    runs-on: ubuntu-latest
    steps:
      - name: "Skip signing gate on feature branches"
        if: github.ref != 'refs/heads/master'
        run: echo "Signing and attestation are master-only."

      - name: "Require all signing matrices to pass"
        if: >-
          ${{
            github.ref == 'refs/heads/master' &&
            (
              needs.sign-go.result != 'success' ||
              needs.sign-controllers.result != 'success' ||
              needs.sign-kpt.result != 'success'
            )
          }}
        run: |
          echo "One or more image signing matrices did not pass."
          exit 1

  # ─── ATTEST ──────────────────────────────────────────────────────────
  attest-go:
    if: github.ref == 'refs/heads/master'
    needs: [sign-gate, discover-go]
    strategy:
      fail-fast: true
      matrix:
        command: ${{ fromJson(needs.discover-go.outputs.commands) }}
    uses: ./.github/workflows/image-attest.yaml
    with:
      import-path: ./cmd/${{ matrix.command }}

  attest-controllers:
    if: github.ref == 'refs/heads/master'
    needs: [sign-gate, discover-controllers]
    strategy:
      fail-fast: true
      matrix:
        controller: ${{ fromJson(needs.discover-controllers.outputs.controllers) }}
    uses: ./.github/workflows/image-attest.yaml
    with:
      import-path: ./controllers/${{ matrix.controller }}/cmd/${{ matrix.controller }}

  attest-kpt:
    if: github.ref == 'refs/heads/master'
    needs: [sign-gate, discover-kpt]
    strategy:
      fail-fast: true
      matrix:
        function: ${{ fromJson(needs.discover-kpt.outputs.functions) }}
    uses: ./.github/workflows/image-attest.yaml
    with:
      import-path: ./${{ matrix.function }}

  # ─── KPT FUNCTIONS ───────────────────────────────────────────────────
  kpt-render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Render"
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Upload rendered package"
        uses: actions/upload-artifact@v7
        with:
          name: rendered-kpt-package
          path: kubernetes/sovereignite.net/adk/shipcrew
          retention-days: 1

  kpt-validate:
    needs: kpt-render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Download rendered package"
        uses: actions/download-artifact@v7
        with:
          name: rendered-kpt-package
          path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Validate kubeconform"
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Validate gatekeeper"
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  kpt-provenance:
    if: >-
      ${{
        github.ref == 'refs/heads/master' &&
        needs.kpt-validate.result == 'success' &&
        needs.attest-kpt.result == 'success'
      }}
    needs: [kpt-validate, attest-kpt]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Setup kpt"
        uses: ./.github/actions/kpt-setup

      - name: "Download rendered package"
        uses: actions/download-artifact@v7
        with:
          name: rendered-kpt-package
          path: kubernetes/sovereignite.net/adk/shipcrew

      - name: "Compute artifact name"
        id: artifact
        run: echo "name=$(echo 'kubernetes/sovereignite.net/kpt-functions/provenance' | sed 's|/|-|g; s|^-||; s|-$||')" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Download image ref"
        uses: actions/download-artifact@v7
        with:
          name: image-ref-${{ steps.artifact.outputs.name }}
          path: /tmp/image-ref/

      - name: "Read image ref"
        id: ref
        run: |
          echo "image=$(cat /tmp/image-ref/image)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat /tmp/image-ref/digest)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Provenance"
        uses: ./.github/actions/kpt-provenance
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew
          image: ${{ steps.ref.outputs.image }}@${{ steps.ref.outputs.digest }}

  notify-failure:
    if: >-
      ${{
        github.ref == 'refs/heads/master' &&
        always() &&
        contains(needs.*.result, 'failure')
      }}
    needs: [discover-go, discover-controllers, discover-kpt, discover-libraries, lint-go, lint-controllers, lint-kpt, lint-libraries, test-go, test-controllers, test-kpt, test-libraries, quality-gate, build-go, build-controllers, build-kpt, build-gate, scan-go, scan-controllers, scan-kpt, scan-gate, sign-go, sign-controllers, sign-kpt, sign-gate, attest-go, attest-controllers, attest-kpt, kpt-render, kpt-validate, kpt-provenance]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: CI (${{ github.sha }})"
          labels: "ci-failure"
