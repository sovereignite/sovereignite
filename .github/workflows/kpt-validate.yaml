# .github/workflows/kpt-validate.yaml
# Reusable workflow for kpt package validation
# Maintains source provenance through kpt's package management

name: kpt Validation

on:
  workflow_call:
    inputs:
      package_path:
        description: 'Path to kpt package directory'
        required: true
        type: string
      kubernetes_version:
        description: 'Kubernetes version for schema validation'
        required: false
        type: string
        default: '1.36'
      strict_mode:
        description: 'Fail on warnings'
        required: false
        type: boolean
        default: true
      enable_schema_validation:
        description: 'Run kubeconform schema validation'
        required: false
        type: boolean
        default: true
      enable_policy_validation:
        description: 'Run gatekeeper policy validation'
        required: false
        type: boolean
        default: false
      enable_render:
        description: 'Run kpt fn render to validate pipeline'
        required: false
        type: boolean
        default: true
    secrets:
      GATEKEEPER_CONFIG:
        description: 'Gatekeeper configuration'
        required: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup kpt
        uses: kptdev/kpt-github-actions/setup@v1

      - name: Capture commit SHA
        id: commit
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Validate Kptfile exists
        run: |
          if [ ! -f "${{ inputs.package_path }}/Kptfile" ]; then
            echo "::error::Kptfile not found in ${{ inputs.package_path }}"
            exit 1
          fi

      - name: Validate package structure
        run: |
          # Check source directory exists
          if [ ! -d "${{ inputs.package_path }}/source" ]; then
            echo "::warning::Source directory not found"
          fi
          
          # Check localized directory exists
          if [ ! -d "${{ inputs.package_path }}/localized" ]; then
            echo "::warning::Localized directory not found"
          fi

      - name: Generate package tree
        run: |
          mkdir -p artifacts
          kpt pkg tree "${{ inputs.package_path }}" > artifacts/package-tree.txt

      - name: Render package (if enabled)
        if: inputs.enable_render
        run: |
          kpt fn render "${{ inputs.package_path }}" \
            --results-dir artifacts/render-results/ \
            --output artifacts/rendered/

      - name: Validate with kubeconform (if enabled)
        if: inputs.enable_schema_validation
        run: |
          kpt fn eval "${{ inputs.package_path }}" \
            -i ghcr.io/kptdev/krm-functions-catalog/kubeconform:v0.1.4 \
            --results-dir artifacts/schema-validation/ \
            -- \
            strict=${{ inputs.strict_mode }} \
            kubernetes-version=${{ inputs.kubernetes_version }}

      - name: Validate with gatekeeper (if enabled)
        if: inputs.enable_policy_validation
        run: |
          kpt fn eval "${{ inputs.package_path }}" \
            -i ghcr.io/kptdev/krm-functions-catalog/gatekeeper:v0.2.5 \
            --results-dir artifacts/policy-validation/

      - name: Generate source/localized diff
        run: |
          mkdir -p artifacts/diff
          
          # Compare source kustomization output with localized files
          if [ -d "${{ inputs.package_path }}/source" ] && [ -d "${{ inputs.package_path }}/localized" ]; then
            # Build from source
            kustomize build "${{ inputs.package_path }}/source" > artifacts/diff/source-build.yaml 2>/dev/null || true
            
            # Concatenate localized files
            cat "${{ inputs.package_path }}/localized"/*.yaml > artifacts/diff/localized.yaml 2>/dev/null || true
            
            # Generate diff
            diff artifacts/diff/source-build.yaml artifacts/diff/localized.yaml > artifacts/diff/drift.txt 2>&1 || true
            
            # Check for drift
            if [ -s artifacts/diff/drift.txt ]; then
              echo "::warning::Drift detected between source and localized"
              echo "DRIFT_DETECTED=true" >> "$GITHUB_ENV"
            else
              echo "DRIFT_DETECTED=false" >> "$GITHUB_ENV"
            fi
          fi

      - name: Generate provenance report
        run: |
          cat > artifacts/provenance.md << EOF
          ## Source Provenance Report
          
          **Package:** ${{ inputs.package_path }}
          **Commit:** ${{ steps.commit.outputs.sha }}
          **Timestamp:** $(date -u +"%Y-%m-%dT%H:%M:%SZ")
          **Kubernetes Version:** ${{ inputs.kubernetes_version }}
          
          ### Kptfile Contents
          \`\`\`yaml
          $(cat "${{ inputs.package_path }}/Kptfile")
          \`\`\`
          
          ### Source Files
          $(find "${{ inputs.package_path }}/source" -name "*.yaml" -type f | sort)
          
          ### Localized Files
          $(find "${{ inputs.package_path }}/localized" -name "*.yaml" -type f | sort)
          
          ### Validation Summary
          - Schema Validation: ${{ inputs.enable_schema_validation }}
          - Policy Validation: ${{ inputs.enable_policy_validation }}
          - Drift Detected: ${{ env.DRIFT_DETECTED }}
          
          ### Package Structure
          \`\`\`
          $(cat artifacts/package-tree.txt)
          \`\`\`
          EOF

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpt-validation-${{ steps.commit.outputs.sha }}
          path: artifacts/
          retention-days: 90

  provenance:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v7

      - name: Verify source provenance
        run: |
          # Check that Kptfile has upstream information
          if ! grep -q "upstream:" "${{ inputs.package_path }}/Kptfile"; then
            echo "::warning::Kptfile missing upstream information"
          fi
          
          # Check that Kptfile has pipeline definition
          if ! grep -q "pipeline:" "${{ inputs.package_path }}/Kptfile"; then
            echo "::warning::Kptfile missing pipeline definition"
          fi

      - name: Download validation artifacts
        uses: actions/download-artifact@v7
        with:
          name: kpt-validation-${{ needs.validate.outputs.sha }}
          path: validation-results/

      - name: Generate provenance summary
        run: |
          echo "## Provenance Summary" > provenance-summary.md
          echo "" >> provenance-summary.md
          echo "- **Commit:** ${{ needs.validate.outputs.sha }}" >> provenance-summary.md
          echo "- **Package:** ${{ inputs.package_path }}" >> provenance-summary.md
          echo "- **Validation Status:** See artifacts" >> provenance-summary.md
          echo "- **Drift Detected:** ${{ env.DRIFT_DETECTED }}" >> provenance-summary.md

      - uses: actions/upload-artifact@v7
        with:
          name: provenance-summary
          path: provenance-summary.md
