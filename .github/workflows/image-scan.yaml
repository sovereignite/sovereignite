name: Image Scan

on:
  workflow_call:
    inputs:
      import-path:
        description: 'Go import path (for artifact lookup)'
        required: true
        type: string
      target-id:
        description: 'Stable logical target id used in artifact names'
        required: true
        type: string

permissions:
  contents: read
  security-events: write

jobs:
  scan:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v7

      - name: "Download image ref"
        uses: actions/download-artifact@v7
        with:
          name: image-ref-${{ inputs.target-id }}
          path: /tmp/image-ref/

      - name: "Read image ref"
        id: ref
        run: |
          echo "image=$(cat /tmp/image-ref/image)" >> "$GITHUB_OUTPUT"
          echo "digest=$(cat /tmp/image-ref/digest)" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: "Scan"
        uses: ./.github/actions/image-scan
        with:
          image: ${{ steps.ref.outputs.image }}
          digest: ${{ steps.ref.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}
          artifact-name: scan-sarif-${{ inputs.target-id }}
