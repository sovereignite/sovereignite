name: kpt-fn-provenance

on:
  push:
    branches: [master, 'feature/**']
  pull_request:
    branches: [master, 'feature/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.build.outputs.image }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - name: "Build"
        id: build
        uses: ./.github/actions/ko-build
        with:
          import-path: ./kubernetes/sovereignite.net/kpt-functions/provenance

  scan:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Scan"
        uses: ./.github/actions/image-scan
        with:
          image: ${{ needs.build.outputs.image }}
          digest: ${{ needs.build.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}

  sign:
    needs: [build, scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Sign"
        uses: ./.github/actions/image-sign
        with:
          image: ${{ needs.build.outputs.image }}
          digest: ${{ needs.build.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}

  attest:
    needs: [build, sign]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Attest"
        uses: ./.github/actions/image-attest
        with:
          image: ${{ needs.build.outputs.image }}
          digest: ${{ needs.build.outputs.digest }}
          token: ${{ secrets.GITHUB_TOKEN }}

  notify-failure:
    if: failure() && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    needs: [build, scan, sign, attest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: "Notify"
        uses: ./.github/actions/notify-failure
        with:
          title: "Build failed: kpt-fn-provenance (${{ github.sha }})"
          labels: "ci-failure,kpt-fn"
