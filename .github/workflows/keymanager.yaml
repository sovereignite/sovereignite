name: keymanager

on:
  pull_request:
    branches: [master]
    paths:
      - 'cmd/keymanager/**'
      - 'internal/keymanager/**'
      - 'internal/tpm/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ./cmd/keymanager/... ./internal/keymanager/...

      - name: Test
        run: go test ./cmd/keymanager/... ./internal/keymanager/...

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failed: keymanager (${context.sha.substring(0, 7)})`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\nPR: ${context.payload.pull_request.html_url}`,
              labels: ['ci-failure', 'keymanager']
            })
