name: Discover Components

on:
  workflow_call:
    outputs:
      go-commands:
        description: 'Go commands in cmd/*'
        value: ${{ jobs.discover.outputs.go-commands }}
      controllers:
        description: 'Controllers in controllers/*/cmd/*'
        value: ${{ jobs.discover.outputs.controllers }}
      kpt-functions:
        description: 'kpt functions in kubernetes/*/kpt-functions/*'
        value: ${{ jobs.discover.outputs.kpt-functions }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      go-commands: ${{ steps.discover.outputs.go-commands }}
      controllers: ${{ steps.discover.outputs.controllers }}
      kpt-functions: ${{ steps.discover.outputs.kpt-functions }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        run: |
          # Go commands (cmd/*), excluding client
          GO_COMMANDS=$(find cmd -maxdepth 1 -type d -not -name cmd -not -name client | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "go-commands=$GO_COMMANDS" >> $GITHUB_OUTPUT

          # Controllers (controllers/*/cmd/*)
          CONTROLLERS=$(find controllers -type d -name "cmd" -exec dirname {} \; | xargs -I {} basename {} | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "controllers=$CONTROLLERS" >> $GITHUB_OUTPUT

          # kpt functions (kubernetes/*/kpt-functions/*)
          KPT_FUNCTIONS=$(find kubernetes/*/kpt-functions -maxdepth 1 -type d -not -name kpt-functions | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "kpt-functions=$KPT_FUNCTIONS" >> $GITHUB_OUTPUT
        shell: bash
