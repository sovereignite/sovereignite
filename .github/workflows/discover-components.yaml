name: Discover Components

on:
  workflow_call:
    outputs:
      go-commands:
        description: 'Go command names in cmd/*'
        value: ${{ jobs.discover.outputs.go-commands }}
      controllers:
        description: 'Controller names in controllers/*'
        value: ${{ jobs.discover.outputs.controllers }}
      kpt-functions:
        description: 'kpt function names in kubernetes/*/kpt-functions/*'
        value: ${{ jobs.discover.outputs.kpt-functions }}
      libraries:
        description: 'Library names in internal/*'
        value: ${{ jobs.discover.outputs.libraries }}

jobs:
  discover:
    runs-on: ubuntu-latest
    outputs:
      go-commands: ${{ steps.discover.outputs.go-commands }}
      controllers: ${{ steps.discover.outputs.controllers }}
      kpt-functions: ${{ steps.discover.outputs.kpt-functions }}
      libraries: ${{ steps.discover.outputs.libraries }}
    steps:
      - uses: actions/checkout@v7

      - name: "Discover"
        id: discover
        run: |
          # Go command names (cmd/*), excluding client
          GO_COMMANDS=$(find cmd -maxdepth 1 -type d -not -name cmd -not -name client -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "go-commands=$GO_COMMANDS" >> $GITHUB_OUTPUT

          # Controller names (controllers/*)
          CONTROLLERS=$(find controllers -maxdepth 1 -type d -not -name controllers -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "controllers=$CONTROLLERS" >> $GITHUB_OUTPUT

          # kpt function names (kubernetes/*/kpt-functions/*)
          KPT_FUNCTIONS=$(find kubernetes/*/kpt-functions -maxdepth 1 -type d -not -name kpt-functions -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "kpt-functions=$KPT_FUNCTIONS" >> $GITHUB_OUTPUT

          # Library names (internal/*)
          LIBRARIES=$(find internal -maxdepth 1 -type d -not -name internal -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "libraries=$LIBRARIES" >> $GITHUB_OUTPUT
        shell: bash
