name: Build service image

on:
  workflow_call:
    inputs:
      build:
        required: true
        type: string
        description: ko build ID from .ko.yaml
      paths:
        required: false
        type: string
        description: Comma-separated path filters for trigger

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: ko-build/setup-ko@v0.8

      - name: Build and push
        env:
          KO_DOCKER_REPO: ghcr.io/${{ github.repository_owner }}/sovereignite
        run: ko build --bare --tags ${{ github.ref_name }} ./cmd/${{ inputs.build }}
