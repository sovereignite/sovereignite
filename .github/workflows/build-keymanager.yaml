name: Build keymanager

on:
  push:
    branches: [master]
    paths:
      - 'cmd/keymanager/**'
      - 'internal/keymanager/**'
      - 'internal/tpm/**'
      - '.ko.yaml'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/*keymanager*'
  workflow_dispatch:

jobs:
  build:
    uses: ./.github/workflows/build-service.yaml
    with:
      build: keymanager
