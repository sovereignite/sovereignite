# .github/workflows/kpt-shipcrew.yaml
# CI workflow for shipcrew kpt package validation

name: kpt Shipcrew Validation

on:
  push:
    branches: [master]
    paths:
      - 'kubernetes/sovereignite.net/adk/shipcrew/**'
      - '.github/workflows/kpt-shipcrew.yaml'
      - '.github/workflows/kpt-validate.yaml'
  pull_request:
    branches: [master]
    paths:
      - 'kubernetes/sovereignite.net/adk/shipcrew/**'
      - '.github/workflows/kpt-shipcrew.yaml'
      - '.github/workflows/kpt-validate.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  issues: write

jobs:
  validate:
    uses: ./.github/workflows/kpt-validate.yaml
    with:
      package_path: kubernetes/sovereignite.net/adk/shipcrew
      kubernetes_version: '1.36'
      strict_mode: true
      enable_schema_validation: true
      enable_policy_validation: false
      enable_render: true

  notify-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `kpt validation failed: shipcrew (${context.sha.substring(0, 7)})`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure', 'shipcrew', 'kpt']
            })
