# .github/workflows/kpt-shipcrew.yaml
# CI workflow for shipcrew kpt package validation

name: kpt Shipcrew Validation

on:
  push:
    branches: [master]
    paths:
      - 'kubernetes/sovereignite.net/adk/shipcrew/**'
      - '.github/workflows/kpt-shipcrew.yaml'
      - '.github/actions/kpt-*/**'
  pull_request:
    branches: [master]
    paths:
      - 'kubernetes/sovereignite.net/adk/shipcrew/**'
      - '.github/workflows/kpt-shipcrew.yaml'
      - '.github/actions/kpt-*/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write
  security-events: write
  issues: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup kpt
        uses: ./.github/actions/kpt-setup

      - name: Render package
        uses: ./.github/actions/kpt-render
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: Validate with kubeconform
        uses: ./.github/actions/kpt-kubeconform
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

      - name: Validate with gatekeeper
        uses: ./.github/actions/kpt-gatekeeper
        with:
          package_path: kubernetes/sovereignite.net/adk/shipcrew

  notify-failure:
    if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `kpt validation failed: shipcrew (${context.sha.substring(0, 7)})`,
              body: `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ['ci-failure', 'shipcrew', 'kpt']
            })
