name: 'Image Attest'
description: 'Attest build provenance for container image'
inputs:
  image:
    description: 'Image reference (without digest)'
    required: true
  digest:
    description: 'Image digest'
    required: true
  token:
    description: 'GitHub token for GHCR login'
    required: true
runs:
  using: "composite"
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Attest build provenance
      uses: actions/attest-build-provenance@v4
      with:
        subject-name: ${{ inputs.image }}
        subject-digest: ${{ inputs.digest }}
        push-to-registry: true
