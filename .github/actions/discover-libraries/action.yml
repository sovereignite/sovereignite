name: 'Discover Libraries'
description: 'Find all shared libraries in internal/*'
inputs:
  changed-files:
    description: 'Newline-delimited changed file paths'
    required: false
  full-build:
    description: 'Whether all targets are required'
    required: false
    default: 'false'
outputs:
  libraries:
    description: 'List of library names'
    value: ${{ steps.discover.outputs.libraries }}
  has-targets:
    description: 'Whether any libraries are affected'
    value: ${{ steps.discover.outputs.has-targets }}
runs:
  using: "composite"
  steps:
    - name: "Discover"
      id: discover
      env:
        CHANGED_FILES: ${{ inputs.changed-files }}
        FULL_BUILD: ${{ inputs.full-build }}
      run: |
        mapfile -t candidates < <(find internal -maxdepth 1 -type d -not -name internal -exec basename {} \; | sort)
        changed="$CHANGED_FILES"
        full_build="$FULL_BUILD"
        if printf '%s\n' "$changed" | awk '/^\.github\// || /^(go\.mod|go\.sum|go\.work|go\.work\.sum|\.ko\.yaml)$/ || /^pkg\// || /^internal\/shared\// { found=1 } END { exit !found }'; then
          full_build=true
        fi

        selected=()
        for library in "${candidates[@]}"; do
          if [ "$full_build" = true ] || printf '%s\n' "$changed" | awk -v prefix="internal/$library/" '$0 ~ "^" prefix { found=1 } END { exit !found }'; then
            selected+=("$library")
          fi
        done

        if [ "${#selected[@]}" -eq 0 ]; then
          echo 'libraries=["__skip__"]' >> "$GITHUB_OUTPUT"
          echo 'has-targets=false' >> "$GITHUB_OUTPUT"
        else
          libraries=$(printf '%s\n' "${selected[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "libraries=$libraries" >> "$GITHUB_OUTPUT"
          echo 'has-targets=true' >> "$GITHUB_OUTPUT"
        fi
      shell: bash
