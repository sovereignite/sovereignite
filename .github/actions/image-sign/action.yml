name: 'Image Sign'
description: 'Sign container image with cosign'
inputs:
  image:
    description: 'Image reference (without digest)'
    required: true
  digest:
    description: 'Image digest'
    required: true
  token:
    description: 'GitHub token for GHCR login'
    required: true
runs:
  using: "composite"
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Install cosign
      uses: sigstore/cosign-installer@v3

    - name: Sign image
      run: cosign sign --yes ${{ inputs.image }}@${{ inputs.digest }}
      shell: bash
