name: 'ko Build'
description: 'Build and push image with ko'
inputs:
  import-path:
    description: 'Go import path to build'
    required: true
  image-name:
    description: 'Canonical image repository name'
    required: true
  tag:
    description: 'Image tag (defaults to branch name)'
    required: false
    default: ''
  go-version-file:
    description: 'Path to go.mod for Go version detection'
    required: false
    default: 'go.mod'
outputs:
  image:
    description: 'Image reference (without tag/digest)'
    value: ${{ steps.build.outputs.image }}
  digest:
    description: 'Image digest'
    value: ${{ steps.build.outputs.digest }}
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - name: Setup ko
      uses: ko-build/setup-ko@v0.10

    - name: Build and push
      id: build
      run: |
        TAG="${{ inputs.tag }}"
        if [ -z "$TAG" ]; then
          TAG=$(echo "${{ github.ref_name }}" | sed 's/[^a-zA-Z0-9._-]/-/g')
        fi
        export KO_DOCKER_REPO="ghcr.io/${GITHUB_REPOSITORY%%/*}/${{ inputs.image-name }}"
        REF=$(ko build --tags "$TAG" --bare "${{ inputs.import-path }}")
        echo "digest=$(echo "$REF" | grep -oP 'sha256:[a-f0-9]+')" >> "$GITHUB_OUTPUT"
        echo "image=$(echo "$REF" | sed 's/[:@].*//')" >> "$GITHUB_OUTPUT"
      shell: bash
