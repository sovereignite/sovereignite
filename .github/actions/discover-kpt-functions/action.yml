name: 'Discover kpt Functions'
description: 'Find all kpt functions in kubernetes/*/kpt-functions/*'
inputs:
  changed-files:
    description: 'Newline-delimited changed file paths'
    required: false
  full-build:
    description: 'Whether all targets are required'
    required: false
    default: 'false'
outputs:
  functions:
    description: 'List of kpt function import paths'
    value: ${{ steps.discover.outputs.functions }}
  has-targets:
    description: 'Whether any kpt functions are affected'
    value: ${{ steps.discover.outputs.has-targets }}
runs:
  using: "composite"
  steps:
    - name: "Discover"
      id: discover
      env:
        CHANGED_FILES: ${{ inputs.changed-files }}
        FULL_BUILD: ${{ inputs.full-build }}
      run: |
        mapfile -t candidates < <(find kubernetes/*/kpt-functions -maxdepth 1 -type d -not -name kpt-functions | sort)
        changed="$CHANGED_FILES"
        full_build="$FULL_BUILD"
        if printf '%s\n' "$changed" | awk '/^\.github\// || /^(go\.mod|go\.sum|go\.work|go\.work\.sum|\.ko\.yaml)$/ { found=1 } END { exit !found }'; then
          full_build=true
        fi

        selected=()
        for function in "${candidates[@]}"; do
          if [ "$full_build" = true ] || printf '%s\n' "$changed" | awk -v prefix="$function/" '$0 ~ "^" prefix { found=1 } END { exit !found }'; then
            selected+=("$function")
          fi
        done

        if [ "${#selected[@]}" -eq 0 ]; then
          echo 'functions=["__skip__"]' >> "$GITHUB_OUTPUT"
          echo 'has-targets=false' >> "$GITHUB_OUTPUT"
        else
          functions=$(printf '%s\n' "${selected[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "functions=$functions" >> "$GITHUB_OUTPUT"
          echo 'has-targets=true' >> "$GITHUB_OUTPUT"
        fi
      shell: bash
