name: 'Image Scan'
description: 'Scan container image for vulnerabilities'
inputs:
  image:
    description: 'Image reference (without digest)'
    required: true
  digest:
    description: 'Image digest'
    required: true
  fail-build:
    description: 'Fail build on vulnerabilities'
    required: false
    default: 'true'
  token:
    description: 'GitHub token for GHCR login'
    required: true
outputs:
  sarif:
    description: 'Path to SARIF report'
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: "composite"
  steps:
    - name: Login to GHCR
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.token }}

    - name: Scan image
      id: scan
      uses: anchore/scan-action@v7
      with:
        image: ${{ inputs.image }}@${{ inputs.digest }}
        fail-build: ${{ inputs.fail-build }}
        output-format: sarif

    - name: Upload SARIF to GitHub
      if: always()
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}

    - name: Upload SARIF artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: sarif-report
        path: ${{ steps.scan.outputs.sarif }}
