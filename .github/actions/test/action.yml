name: 'Test'
description: 'Run Go tests with JUnit report'
inputs:
  paths:
    description: 'Paths to test'
    required: true
  go-version-file:
    description: 'Path to go.mod for Go version detection'
    required: false
    default: 'go.mod'
  report-name:
    description: 'Name for the test report artifact'
    required: false
    default: 'test-report'
runs:
  using: "composite"
  steps:
    - name: Setup Go
      uses: actions/setup-go@v7
      with:
        go-version-file: ${{ inputs.go-version-file }}

    - name: Install gotestsum
      run: go install gotest.tools/gotestsum@latest
      shell: bash

    - name: "Test"
      run: gotestsum --junitfile reports/tests.xml --format standard-verbose -- -short ${{ inputs.paths }}
      shell: bash

    - name: "Report"
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ${{ inputs.report-name }}
        path: reports/tests.xml
