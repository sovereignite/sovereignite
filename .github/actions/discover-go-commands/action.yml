name: 'Discover Go Commands'
description: 'Find all Go commands in cmd/*'
inputs:
  changed-files:
    description: 'Newline-delimited changed file paths'
    required: false
  full-build:
    description: 'Whether all targets are required'
    required: false
    default: 'false'
outputs:
  commands:
    description: 'List of Go command names'
    value: ${{ steps.discover.outputs.commands }}
  has-targets:
    description: 'Whether any Go commands are affected'
    value: ${{ steps.discover.outputs.has-targets }}
runs:
  using: "composite"
  steps:
    - name: "Discover"
      id: discover
      env:
        CHANGED_FILES: ${{ inputs.changed-files }}
        FULL_BUILD: ${{ inputs.full-build }}
      run: |
        mapfile -t candidates < <(find cmd -maxdepth 1 -type d -not -name cmd -not -name client -exec basename {} \; | sort)
        changed="$CHANGED_FILES"
        full_build="$FULL_BUILD"
        if printf '%s\n' "$changed" | awk '/^\.github\// || /^(go\.mod|go\.sum|go\.work|go\.work\.sum|\.ko\.yaml)$/ || /^internal\// || /^pkg\// { found=1 } END { exit !found }'; then
          full_build=true
        fi

        selected=()
        for command in "${candidates[@]}"; do
          if [ "$full_build" = true ] || printf '%s\n' "$changed" | awk -v prefix="cmd/$command/" '$0 ~ "^" prefix { found=1 } END { exit !found }'; then
            selected+=("$command")
          fi
        done

        if [ "${#selected[@]}" -eq 0 ]; then
          echo 'commands=["__skip__"]' >> "$GITHUB_OUTPUT"
          echo 'has-targets=false' >> "$GITHUB_OUTPUT"
        else
          commands=$(printf '%s\n' "${selected[@]}" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "commands=$commands" >> "$GITHUB_OUTPUT"
          echo 'has-targets=true' >> "$GITHUB_OUTPUT"
        fi
      shell: bash
